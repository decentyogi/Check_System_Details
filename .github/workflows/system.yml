name: Runner Benchmark (for Twitch recorder)

# Measures the GitHub runner (disk, CPU, internet, upload speed, cleanup time)
# and uploads a report. Run it from the Actions tab: "Run workflow".

on:
  workflow_dispatch:
    inputs:
      test_channel:
        description: 'Twitch channel for the real bitrate test (only measured if live)'
        default: 'vishislive'
        type: string
      test_size_gb:
        description: 'Test recording size for the ts to mp4 test (GB)'
        default: '4'
        type: string
      drive_test_gb:
        description: 'Google Drive upload test size (GB, 0 = skip)'
        default: '2'
        type: string
      gofile_test_mb:
        description: 'Gofile upload test size (MB, 0 = skip)'
        default: '300'
        type: string
      run_cleanup_test:
        description: 'Delete preinstalled software and time it'
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_CHANNEL: ${{ inputs.test_channel }}
      TEST_SIZE_GB: ${{ inputs.test_size_gb }}
      DRIVE_TEST_GB: ${{ inputs.drive_test_gb }}
      GOFILE_TEST_MB: ${{ inputs.gofile_test_mb }}
      RUN_CLEANUP_TEST: ${{ inputs.run_cleanup_test }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run benchmark
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          #!/usr/bin/env bash
          # ============================================================================
          # GitHub runner benchmark for the Twitch recorder.
          # Measures: runner/image, CPU, RAM, disks + free space, what can be deleted and
          # how long deleting takes, disk speed, internet speed, real Twitch bitrate,
          # ts->mp4 conversion speed, Google Drive / Gofile upload speed.
          # Writes everything to runner_report.txt (KEY NUMBERS first, details after).
          # Nothing here can fail the job: every step is allowed to fail on its own.
          # ============================================================================
          set +e
          export LC_ALL=C
          cd "${BENCH_DIR:-$PWD}" || exit 1

          WORK="$PWD/bench_work"; mkdir -p "$WORK"
          OUT="$PWD/runner_report.txt"
          BODY="$WORK/body.txt"; KEYS="$WORK/keys.txt"
          : > "$BODY"; : > "$KEYS"

          CH="${TEST_CHANNEL:-vishislive}"
          TEST_GB="${TEST_SIZE_GB:-4}"
          DRIVE_GB="${DRIVE_TEST_GB:-2}"
          GOFILE_MB="${GOFILE_TEST_MB:-300}"
          DO_CLEAN="${RUN_CLEANUP_TEST:-true}"
          PFX="${CLEAN_PREFIX:-}"          # only used for safe local testing
          LOCAL="${BENCH_LOCAL:-0}"        # 1 = skip installs / du scans (local testing)
          NETMAX="${NET_MAX_SECONDS:-60}"
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          T0=$(date +%s)

          # ---------------------------------------------------------------- helpers ---
          now()     { date +%s.%N; }
          elapsed() { awk -v a="$1" -v b="$2" 'BEGIN{printf "%.1f", b-a}'; }
          mbps()    { awk -v b="$1" -v s="$2" 'BEGIN{ if (s+0>0) printf "%.1f", b/1048576/s; else print "n/a" }'; }
          free_gb() { df -P -k "$1" 2>/dev/null | awk 'NR==2{printf "%.2f", $4/1048576}'; }
          say()     { echo "$*" >> "$BODY"; }
          kv()      { echo "$1|$2|$3" >> "$KEYS"; }
          getk()    { awk -F'|' -v k="$1" '$1==k{v=$2} END{print v}' "$KEYS"; }
          section() { { echo; echo "=================== $1 ==================="; } >> "$BODY"; echo ">>> $1 (t+$(( $(date +%s) - T0 ))s)"; }
          run()     { { echo "\$ $*"; "$@" 2>&1; echo; } >> "$BODY"; }
          rand_file() { openssl enc -aes-128-ctr -pass pass:bench -pbkdf2 -nosalt < /dev/zero 2>/dev/null | head -c "$2" > "$1"; }
          drop_caches() { $SUDO sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null; }

          # ---------------------------------------------------------- 1. runner info --
          section "1. RUNNER / IMAGE"
          say "date_utc: $(date -u +%FT%TZ)"
          run bash -c 'grep -E "^(PRETTY_NAME|VERSION)=" /etc/os-release; uname -r'
          say "ImageOS=$ImageOS ImageVersion=$ImageVersion RUNNER_NAME=$RUNNER_NAME RUNNER_ARCH=$RUNNER_ARCH"
          kv image_version "${ImageVersion:-unknown}" ""
          if command -v gh >/dev/null 2>&1 && [ -n "$GITHUB_RUN_ID" ]; then
            RC=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at 2>/dev/null)
            JS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[0].started_at' 2>/dev/null)
            if [ -n "$RC" ] && [ -n "$JS" ]; then
              LAT=$(( $(date -d "$JS" +%s) - $(date -d "$RC" +%s) ))
              say "run created: $RC ; job started: $JS"
              kv dispatch_to_job_start_s "$LAT" "seconds from dispatch to runner picking up the job"
            fi
          fi

          # ----------------------------------------------------------- 2. hardware ----
          section "2. CPU / RAM"
          run lscpu
          run free -m
          run bash -c 'swapon --show 2>&1'
          kv cpu_cores "$(nproc)" ""
          kv cpu_model "$(awk -F: '/model name/{print $2; exit}' /proc/cpuinfo | sed 's/^ //')" ""
          kv ram_gb "$(awk '/MemTotal/{printf "%.1f", $2/1048576}' /proc/meminfo)" ""

          # ------------------------------------------------- 3. disks BEFORE anything --
          section "3. DISKS AND FREE SPACE (before anything is installed or deleted)"
          run df -hT
          run df -hi
          run lsblk -o NAME,SIZE,TYPE,MOUNTPOINT,ROTA
          run bash -c 'findmnt -T . ; echo; mount | grep -E "^/dev/"'
          SEP_MNT=0
          if mountpoint -q /mnt 2>/dev/null; then
            [ "$(stat -c %d /)" != "$(stat -c %d /mnt)" ] && SEP_MNT=1
          fi
          kv free_workdir_gb_start "$(free_gb .)" "disk the recorder writes to"
          kv free_root_gb_start "$(free_gb /)" ""
          kv separate_mnt_disk "$SEP_MNT" "1 = /mnt is a second disk"
          [ "$SEP_MNT" = 1 ] && kv free_mnt_gb_start "$(free_gb /mnt)" "second disk"

          # ------------------------------------------------------ 4. tool install -----
          section "4. TOOL INSTALL TIMES (what the recorder pays at start-up)"
          if [ "$LOCAL" != "1" ]; then
            s=$(now)
            pip install -q --upgrade streamlink >"$WORK/pip.log" 2>&1 || pip install -q --upgrade --break-system-packages streamlink >>"$WORK/pip.log" 2>&1
            e=$(now); kv pip_install_streamlink_s "$(elapsed "$s" "$e")" "needed before recording can start"
            need=""
            for t in ffmpeg jq curl rclone; do command -v "$t" >/dev/null 2>&1 || need="$need $t"; done
            if [ -n "$need" ]; then
              s=$(now); $SUDO apt-get update -qq >/dev/null 2>&1
              $SUDO apt-get install -y -qq $need >"$WORK/apt.log" 2>&1
              e=$(now); kv apt_install_s "$(elapsed "$s" "$e")" "can run in background (installed:$need)"
            fi
          fi
          run bash -c 'ffmpeg -version 2>&1 | head -1; rclone version 2>&1 | head -1; streamlink --version 2>&1'

          # ------------------------------------------------------------- 5. CPU -------
          section "5. CPU SPEED"
          s=$(now)
          ffmpeg -nostdin -loglevel error -y -f lavfi -i testsrc2=size=1920x1080:rate=60 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 -t 30 \
            -c:v libx264 -preset ultrafast -b:v 6M -maxrate 6M -bufsize 12M -g 120 \
            -c:a aac -b:a 160k -f mpegts sample.ts 2>"$WORK/enc.err"
          e=$(now); enc=$(elapsed "$s" "$e")
          kv x264_1080p60_x_realtime "$(awk -v t="$enc" 'BEGIN{ if (t>0) printf "%.2f", 30/t; else print "n/a" }')" "30s of 1080p60 encoded in ${enc}s (higher = faster CPU)"
          s=$(now); python3 -c "
          s=0
          for i in range(20000000): s+=i*i
          " 2>/dev/null; e=$(now)
          kv python_20M_loop_s "$(elapsed "$s" "$e")" "single-thread speed (lower = faster)"
          s=$(now); dd if=/dev/zero bs=1M count=2048 2>/dev/null | sha256sum >/dev/null; e=$(now)
          kv sha256_MBps "$(mbps 2147483648 "$(elapsed "$s" "$e")")" "single-core hashing"

          # --------------------------------------------------------- 6. disk speed ----
          section "6. DISK SPEED (sequential, 2 GB, direct I/O)"
          disk_test() {  # dir label
            local dir="$1" label="$2" f="$1/.bench_io" s e
            $SUDO mkdir -p "$dir" 2>/dev/null; $SUDO chmod 777 "$dir" 2>/dev/null
            s=$(now)
            openssl enc -aes-128-ctr -pass pass:b -pbkdf2 -nosalt < /dev/zero 2>/dev/null | dd of="$f" bs=1M count=2048 iflag=fullblock oflag=direct 2>"$WORK/dd.err" \
              || openssl enc -aes-128-ctr -pass pass:b -pbkdf2 -nosalt < /dev/zero 2>/dev/null | dd of="$f" bs=1M count=2048 iflag=fullblock conv=fdatasync 2>"$WORK/dd.err"
            e=$(now); kv "disk_write_MBps_$label" "$(mbps 2147483648 "$(elapsed "$s" "$e")")" "$dir"
            drop_caches
            s=$(now); dd if="$f" of=/dev/null bs=1M iflag=direct 2>"$WORK/dd.err" || dd if="$f" of=/dev/null bs=1M 2>"$WORK/dd.err"
            e=$(now); kv "disk_read_MBps_$label" "$(mbps 2147483648 "$(elapsed "$s" "$e")")" "$dir"
            rm -f "$f"
          }
          disk_test "$PWD" workdir
          [ "$SEP_MNT" = 1 ] && disk_test /mnt/bench mnt

          # -------------------------------------------------------- 7. internet -------
          section "7. INTERNET"
          say "--- latency (connect / TLS / first byte, seconds) ---"
          for u in https://gql.twitch.tv/gql https://www.googleapis.com/ https://api.gofile.io/servers https://api.github.com/; do
            r=$(curl -s -o /dev/null --max-time 15 -w 'connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer}' "$u" 2>/dev/null)
            say "$u  $r"
          done
          r=$(curl -s -o /dev/null --max-time "$NETMAX" -w '%{size_download} %{time_total}' "https://speed.cloudflare.com/__down?bytes=100000000" 2>/dev/null); set -- $r
          kv download_cloudflare_1conn_MBps "$(mbps "${1:-0}" "${2:-0}")" "100 MB, single connection"
          s=$(now)
          for i in 1 2 3 4; do curl -s -o /dev/null --max-time "$NETMAX" -w '%{size_download}\n' "https://speed.cloudflare.com/__down?bytes=100000000" > "$WORK/p$i" 2>/dev/null & done; wait
          e=$(now); b=$(cat "$WORK"/p? 2>/dev/null | awk '{s+=$1} END{print s+0}')
          kv download_cloudflare_4conn_MBps "$(mbps "$b" "$(elapsed "$s" "$e")")" "4 parallel connections"
          r=$(curl -s -o /dev/null --max-time "$NETMAX" -w '%{size_download} %{time_total}' "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb" 2>/dev/null); set -- $r
          kv download_google_MBps "$(mbps "${1:-0}" "${2:-0}")" "Google CDN"
          head -c 52428800 /dev/urandom > "$WORK/up50.bin"
          r=$(curl -s -o /dev/null --max-time "$NETMAX" -X POST --data-binary @"$WORK/up50.bin" -w '%{size_upload} %{time_total}' "https://speed.cloudflare.com/__up" 2>/dev/null); set -- $r
          kv upload_cloudflare_1conn_MBps "$(mbps "${1:-0}" "${2:-0}")" "50 MB single connection (rough)"
          s=$(now)
          for i in 1 2 3 4; do curl -s -o /dev/null --max-time "$NETMAX" -X POST --data-binary @"$WORK/up50.bin" -w '%{size_upload}\n' "https://speed.cloudflare.com/__up" > "$WORK/u$i" 2>/dev/null & done; wait
          e=$(now); b=$(cat "$WORK"/u? 2>/dev/null | awk '{s+=$1} END{print s+0}')
          kv upload_cloudflare_4conn_MBps "$(mbps "$b" "$(elapsed "$s" "$e")")" "4 parallel connections (rough)"
          rm -f "$WORK/up50.bin" "$WORK"/p? "$WORK"/u?

          # --------------------------------------------------- 8. real Twitch stream ---
          section "8. REAL TWITCH STREAM TEST ($CH)"
          q='{"query":"query($login: String!) { user(login: $login) { stream { id type } } }","variables":{"login":"'"$CH"'"}}'
          r=$(curl -s --max-time 10 -H 'Client-Id: kimne78kx3ncx6brgo4mv6wki5h1ko' -H 'Content-Type: application/json' -d "$q" -w '\n%{time_total}' https://gql.twitch.tv/gql 2>/dev/null)
          TW_STATE=$(echo "$r" | head -n1 | jq -r '.data.user.stream.type // "offline"' 2>/dev/null)
          kv twitch_gql_check_s "$(echo "$r" | tail -n1)" "time of one live-check (same call the Worker makes)"
          say "channel state: ${TW_STATE:-unknown}"
          if [ "$TW_STATE" = "live" ] && command -v streamlink >/dev/null 2>&1; then
            rm -f tw.ts; s=$(now); TT=""
            streamlink --twitch-supported-codecs h264 "https://www.twitch.tv/$CH" best -o tw.ts >"$WORK/streamlink.log" 2>&1 &
            SP=$!
            for i in $(seq 1 180); do
              sleep 0.25
              [ -z "$TT" ] && [ -s tw.ts ] && TT=$(elapsed "$s" "$(now)")
            done
            kill -INT "$SP" 2>/dev/null; wait "$SP" 2>/dev/null
            b=$(stat -c %s tw.ts 2>/dev/null || echo 0)
            kv twitch_first_byte_s "${TT:-none}" "streamlink start to first data written"
            kv twitch_bitrate_MBps "$(awk -v b="$b" -v t="${TT:-45}" 'BEGIN{d=45-t; if (d>5) printf "%.2f", b/1048576/d; else print "n/a"}')" "real stream bitrate over 45s (slightly high: initial burst)"
            say "--- streamlink log (tail) ---"; tail -n 12 "$WORK/streamlink.log" >> "$BODY"
            rm -f tw.ts
          else
            say "Stream not live (or streamlink missing): skipped. Re-run while he is live to get the real bitrate."
            kv twitch_bitrate_MBps "" "not measured (offline) - projection uses 6 and 8 Mbps"
          fi

          # ------------------------------------------------ 9. ts -> mp4 conversion ---
          section "9. TS -> MP4 CONVERSION (same command the recorder uses)"
          FREE=$(free_gb .)
          SZ=$(awk -v f="$FREE" -v t="$TEST_GB" 'BEGIN{m=(f-3)/2; if (m<0.3) m=0.3; if (t<m) m=t; printf "%.2f", m}')
          sb=$(stat -c %s sample.ts 2>/dev/null || echo 0)
          if [ "$sb" -gt 0 ]; then
            loops=$(awk -v t="$SZ" -v b="$sb" 'BEGIN{n=int(t*1073741824/b); if (n<1) n=1; print n-1}')
            s=$(now); ffmpeg -nostdin -loglevel error -y -stream_loop "$loops" -i sample.ts -c copy -f mpegts big.ts 2>"$WORK/loop.err"; e=$(now)
            B=$(stat -c %s big.ts 2>/dev/null || echo 0)
            say "test file: $(awk -v b="$B" 'BEGIN{printf "%.2f GB", b/1073741824}') (requested $SZ GB, free disk was $FREE GB)"
            kv testfile_gb "$(awk -v b="$B" 'BEGIN{printf "%.2f", b/1073741824}')" "size used for conversion/upload math"
            drop_caches
            s=$(now); ffmpeg -nostdin -loglevel error -y -i big.ts -c copy big_same.mp4 2>"$WORK/remux.err"; e=$(now)
            kv remux_same_disk_MBps "$(mbps "$B" "$(elapsed "$s" "$e")")" "ts -> mp4, both on the work disk"
            kv remux_same_disk_s "$(elapsed "$s" "$e")" "for the test file"
            say "free space while ts + mp4 both exist: $(free_gb .) GB"
            rm -f big_same.mp4
            if [ "$SEP_MNT" = 1 ]; then
              $SUDO mkdir -p /mnt/bench; $SUDO chmod 777 /mnt/bench
              drop_caches
              s=$(now); ffmpeg -nostdin -loglevel error -y -i big.ts -c copy /mnt/bench/big_cross.mp4 2>"$WORK/remux2.err"; e=$(now)
              kv remux_to_mnt_MBps "$(mbps "$B" "$(elapsed "$s" "$e")")" "ts on work disk, mp4 on /mnt"
              rm -f /mnt/bench/big_cross.mp4
            fi
            rm -f big.ts
          fi

          # --------------------------------------------------- 10. Google Drive -------
          section "10. GOOGLE DRIVE UPLOAD (real rclone, your RCLONE_CONFIG secret)"
          if [ -n "$RCLONE_CONFIG_DATA" ] && command -v rclone >/dev/null 2>&1 && [ "$DRIVE_GB" != "0" ]; then
            mkdir -p ~/.config/rclone; printf '%s\n' "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
            REMOTE=$(rclone listremotes | head -n 1 | tr -d ':')
            say "remote found: $([ -n "$REMOTE" ] && echo yes || echo NO)"
            if [ -n "$REMOTE" ]; then
              run bash -c "rclone about '$REMOTE:' 2>&1"
              DBYTES=$(awk -v g="$DRIVE_GB" 'BEGIN{printf "%.0f", g*1073741824}')
              rand_file drive_test.bin "$DBYTES"
              best=0
              for CK in 64M 256M; do
                s=$(now)
                rclone copyto drive_test.bin "$REMOTE:_runner_benchmark_tmp/test_$CK.bin" --drive-chunk-size "$CK" --transfers 1 --stats 20s -v >"$WORK/rclone_$CK.log" 2>&1
                rc=$?; e=$(now); sp=$(mbps "$DBYTES" "$(elapsed "$s" "$e")")
                kv "drive_upload_chunk${CK}_MBps" "$sp" "exit=$rc, ${DRIVE_GB} GB file"
                [ "$rc" = 0 ] && best=$(awk -v a="$best" -v b="$sp" 'BEGIN{print (b+0>a+0)? b : a}')
                say "--- rclone log tail (chunk $CK) ---"; tail -n 6 "$WORK/rclone_$CK.log" >> "$BODY"
              done
              kv drive_upload_best_MBps "$best" "best of the chunk-size tests"
              rclone purge "$REMOTE:_runner_benchmark_tmp" --drive-use-trash=false >/dev/null 2>&1
              rm -f drive_test.bin
            fi
          else
            say "skipped (no RCLONE_CONFIG secret, rclone missing, or drive_test_gb = 0)"
          fi

          # ------------------------------------------------------ 11. Gofile ----------
          section "11. GOFILE UPLOAD SPEED"
          gofile_up() {  # file -> prints link
            local f="$1" srv resp st
            srv=$(curl -s --max-time 20 https://api.gofile.io/servers | jq -r '.data.servers[0].name // "store1"' 2>/dev/null)
            resp=$(curl -s --max-time 900 -X POST "https://${srv:-store1}.gofile.io/contents/uploadfile" -F "file=@$f")
            st=$(echo "$resp" | jq -r '.status' 2>/dev/null)
            if [ "$st" != "ok" ]; then
              resp=$(curl -s --max-time 900 -X POST https://upload.gofile.io/uploadfile -F "file=@$f")
              st=$(echo "$resp" | jq -r '.status' 2>/dev/null)
            fi
            [ "$st" = "ok" ] && echo "$resp" | jq -r '.data.downloadPage'
          }
          if [ "$GOFILE_MB" != "0" ] && command -v jq >/dev/null 2>&1; then
            rand_file gofile_test.bin "$(( GOFILE_MB * 1048576 ))"
            s=$(now); L=$(gofile_up gofile_test.bin); e=$(now)
            if [ -n "$L" ]; then kv gofile_upload_MBps "$(mbps "$(( GOFILE_MB * 1048576 ))" "$(elapsed "$s" "$e")")" "${GOFILE_MB} MB test file"
            else kv gofile_upload_MBps "failed" "${GOFILE_MB} MB test file"; fi
            rm -f gofile_test.bin
          else say "skipped"; fi

          # ------------------------------------------- 12. what is taking the space ---
          section "12. WHAT TAKES SPACE (before cleanup)"
          free_before_clean=$(free_gb /)
          if [ "$LOCAL" != "1" ]; then
            say "--- biggest folders on / (KB, depth 2) ---"
            timeout 240 $SUDO du -xk --max-depth=2 / 2>/dev/null | sort -rn | head -45 >> "$BODY"
            say; say "--- 40 biggest installed apt packages (KB) ---"
            dpkg-query -Wf '${Installed-Size}\t${Package}\n' 2>/dev/null | sort -rn | head -40 >> "$BODY"
            say; say "--- /opt/hostedtoolcache and home (KB) ---"
            timeout 120 $SUDO du -sk /opt/hostedtoolcache/* "$HOME"/.[!.]* "$HOME"/* 2>/dev/null | sort -rn | head -25 >> "$BODY"
            say; say "--- docker ---"; docker system df >> "$BODY" 2>&1
          fi

          # ------------------------------------------------ 13. cleanup test ----------
          section "13. CLEANUP TEST (delete candidates, time each one)"
          if [ "$DO_CLEAN" = "true" ]; then
            start_free=$(free_gb /)
            say "free space before cleanup: $start_free GB"
            say ""
            printf '%-44s %9s %8s %12s\n' PATH SIZE_MB RM_SEC FREE_AFTER_GB >> "$BODY"
            CLEAN_T0=$(now)
            for pat in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
                       /usr/local/share/powershell '/usr/local/julia*' /usr/lib/jvm \
                       /usr/lib/google-cloud-sdk /opt/az /opt/microsoft /usr/share/miniconda \
                       /usr/local/miniconda /usr/local/share/chromium /opt/google \
                       /usr/lib/firefox /usr/local/aws-cli /usr/local/aws-sam-cli \
                       /usr/local/graalvm /usr/local/share/vcpkg /usr/local/lib/node_modules \
                       /home/linuxbrew "$HOME/.rustup" "$HOME/.cargo" "$HOME/.dotnet" "$HOME/.ghcup" \
                       /var/lib/apt/lists /var/cache/apt; do
              for p in $PFX$pat; do
                [ -e "$p" ] || continue
                kb=$(timeout 180 $SUDO du -sk "$p" 2>/dev/null | awk '{print $1}')
                s=$(now); $SUDO rm -rf "$p" 2>/dev/null; e=$(now)
                printf '%-44s %9.0f %8.1f %12s\n' "$p" "$(( ${kb:-0} / 1024 ))" "$(elapsed "$s" "$e")" "$(free_gb /)" >> "$BODY"
              done
            done
            if [ -z "$PFX" ] && command -v docker >/dev/null 2>&1; then
              s=$(now); $SUDO docker image prune -af >/dev/null 2>&1; e=$(now)
              printf '%-44s %9s %8.1f %12s\n' "docker images (prune)" "-" "$(elapsed "$s" "$e")" "$(free_gb /)" >> "$BODY"
            fi
            if [ -z "$PFX" ] && [ "$SEP_MNT" = 1 ]; then
              sw=$(swapon --show=NAME --noheadings 2>/dev/null | head -n1)
              mfree=$(free_gb /mnt)
              if [ -n "$sw" ]; then $SUDO swapoff -a 2>/dev/null; $SUDO rm -f "$sw"; fi
              say "swap file removed: ${sw:-none}; /mnt free $mfree -> $(free_gb /mnt) GB"
              kv free_mnt_gb_after_swap_removed "$(free_gb /mnt)" "second disk"
            fi
            CLEAN_T1=$(now)
            end_free=$(free_gb /)
            kv cleanup_total_freed_gb "$(awk -v a="$start_free" -v b="$end_free" 'BEGIN{printf "%.1f", b-a}')" "freed on / by all deletions"
            kv cleanup_total_time_s "$(elapsed "$CLEAN_T0" "$CLEAN_T1")" "time to delete everything (run in background while recording)"
            kv free_root_gb_after_cleanup "$end_free" "free on / once everything above is gone"
            kv free_workdir_gb_after_cleanup "$(free_gb .)" "free on the recorder's disk"
            if [ "$LOCAL" != "1" ]; then
              say; say "--- biggest folders still left on / (KB) ---"
              timeout 240 $SUDO du -xk --max-depth=2 / 2>/dev/null | sort -rn | head -30 >> "$BODY"
            fi
          else
            say "skipped"
          fi

          # ------------------------------------------------------ 14. projection ------
          section "14. PROJECTION: a 5.5 hour recording (auto-calculated)"
          RM=$(getk remux_same_disk_MBps); DR=$(getk drive_upload_best_MBps); TB=$(getk twitch_bitrate_MBps)
          UPSRC="Google Drive test"
          if [ -z "$DR" ] || [ "$DR" = "0" ]; then DR=$(getk upload_cloudflare_4conn_MBps); UPSRC="generic network upload (no Drive test ran)"; fi
          FA=$(getk free_workdir_gb_after_cleanup); [ -z "$FA" ] && FA=$(getk free_workdir_gb_start)
          say "upload speed used below: ${DR:-unknown} MB/s  ($UPSRC)"
          for lb in "measured:${TB:-0}" "6Mbps:0.75" "8Mbps:1.0"; do
            lbl=${lb%%:*}; br=${lb##*:}
            { [ -z "$br" ] || [ "$br" = "0" ] || [ "$br" = "n/a" ]; } && continue
            awk -v l="$lbl" -v br="$br" -v rm="$RM" -v dr="$DR" -v fa="$FA" 'BEGIN{
              gb = br*5.5*3600/1024
              r = (rm+0>0) ? gb*1024/rm/60 : -1
              u = (dr+0>0) ? gb*1024/dr/60 : -1
              printf "[%s] bitrate %.2f MB/s -> file %.1f GB | disk needed (ts+mp4) %.1f GB vs free %s GB\n", l, br, gb, gb*2, fa
              if (r>=0) printf "        convert ts->mp4: %.1f min\n", r; else printf "        convert: unknown\n"
              if (u>=0) printf "        upload: %.1f min\n", u; else printf "        upload: unknown\n"
              if (r>=0 && u>=0) printf "        total %.1f min (budget 20 min; the 6h job limit leaves 30 min after 5.5h)\n", r+u
            }' >> "$BODY"
          done

          # -------------------------------------------------------- final report ------
          {
            echo "RUNNER BENCHMARK REPORT   total runtime: $(( $(date +%s) - T0 )) s   channel tested: $CH"
            echo
            echo "KEY NUMBERS"
            echo "-----------"
            awk -F'|' '{printf "%-40s %-16s %s\n", $1, $2, $3}' "$KEYS"
            echo
            echo "DETAILS"
            cat "$BODY"
          } > "$OUT"

          echo "================ REPORT ================"
          cat "$OUT"

          # ------------------------------------------- upload the report (Gofile) -----
          LINK=$(gofile_up "$OUT")
          if [ -z "$LINK" ]; then
            LINK=$(curl -s --max-time 120 -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@$OUT" https://litterbox.catbox.moe/resources/internals/api.php)
            case "$LINK" in https*) ;; *) LINK="" ;; esac
          fi
          echo "${LINK:-UPLOAD_FAILED}" > "$PWD/report_link.txt"
          echo "REPORT LINK: ${LINK:-upload failed - use the run summary or the artifact instead}"
          rm -f "$PWD/sample.ts" 2>/dev/null

      - name: Show results in the run summary
        if: always()
        run: |
          {
            echo "### Runner benchmark"
            echo
            echo "Report link: $(cat report_link.txt 2>/dev/null)"
            echo
            echo '```'
            sed -n '1,45p' runner_report.txt
            awk '/=== 14\./{p=1} p' runner_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report as a download (backup to the link)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-report
          path: runner_report.txt
